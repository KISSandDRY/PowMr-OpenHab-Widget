                          d: M35 50 L40 55 L35 60
                          fill: none
                          stroke: "=props.gridtoac2dcFlowColor || 'var(--icon-color-default)'"
                          stroke-width: 3
                          stroke-linecap: round
                          stroke-linejoin: round

                # ac2dc to battery flow
                - component: f7-row
                  config:
                    tag: g
                    class: smooth-fade
                    opacity: "=props.itemBatteryChargeCurrent && Number.parseFloat(items[props.itemBatteryChargeCurrent].state) > 0 ? '1' : '0'"
                  slots:
                    default:
                      - component: f7-row
                        config:
                          tag: path
                          d: M105 55 L170 55 L170 105
                          fill: none
                          stroke: "=props.ac2dctobatteryFlowColor || 'var(--icon-color-default)'"
                          stroke-width: 3
                          stroke-linecap: round
                          stroke-linejoin: round
                          stroke-dasharray: 10 6
                        slots:
                          default:
                            - component: f7-row
                              config:
                                tag: animate
                                attributeName: stroke-dashoffset
                                values: 16;0
                                repeatCount: indefinite
                                dur: "=Math.max(0.5, Math.min(6, 100 / (Number.parseFloat(props.itemBatteryChargeCurrent ? items[props.itemBatteryChargeCurrent].state : 1) || 1))) + 's'"
                      - component: f7-row
                        config:
                          tag: path
                          d: M165 100 L170 105 L175 100
                          fill: none
                          stroke: "=props.ac2dctobatteryFlowColor || 'var(--icon-color-default)'"
                          stroke-width: 3
                          stroke-linecap: round
                          stroke-linejoin: round

                # battery to dc2ac flow
                - component: f7-row
                  config:
                    tag: g
                    class: smooth-fade
                    opacity: "=(props.itemRunningOnBattery && items[props.itemRunningOnBattery].state === 'ON') || (props.itemBatteryDischargeCurrent && Number.parseFloat(items[props.itemBatteryDischargeCurrent].state) > 0.2) ? '1' : '0'"
                  slots:
                    default:
                      - component: f7-row
                        config:
                          tag: path
                          d: M190 100 L190 55 L250 55
                          fill: none
                          stroke: "=props.batterytodc2acFlowColor || 'var(--icon-color-default)'"
                          stroke-width: 3
                          stroke-linecap: round
                          stroke-linejoin: round
                          stroke-dasharray: 10 6
                        slots:
                          default:
                            - component: f7-row
                              config:
                                tag: animate
                                attributeName: stroke-dashoffset
                                values: 16;0
                                repeatCount: indefinite
                                dur: "=Math.max(0.5, Math.min(6, 100 / (Number.parseFloat(props.itemBatteryDischargeCurrent ? items[props.itemBatteryDischargeCurrent].state : 1) || 1))) + 's'"
                      - component: f7-row
                        config:
                          tag: path
                          d: M245 50 L250 55 L245 60
                          fill: none
                          stroke: "=props.batterytodc2acFlowColor || 'var(--icon-color-default)'"
                          stroke-width: 3
                          stroke-linecap: round
                          stroke-linejoin: round

                # dc2ac to house flow
                - component: f7-row
                  config:
                    tag: g
                    class: smooth-fade
                    opacity: "=props.itemLoadPower && Number.parseFloat(items[props.itemLoadPower].state) > 5 && items[props.itemGridActive].state !== 'ON' ? '1' : '0'"
                  slots:
                    default:
                      - component: f7-row
                        config:
                          tag: path
                          d: M315 55 L385 55 L385 105
                          fill: none
                          stroke: "=props.dc2actohouseFlowColor || 'var(--icon-color-default)'"
                          stroke-width: 3
                          stroke-linecap: round
                          stroke-linejoin: round
                          stroke-dasharray: 10 6
                        slots:
                          default:
                            - component: f7-row
                              config:
                                tag: animate
                                attributeName: stroke-dashoffset
                                values: 16;0
                                repeatCount: indefinite
                                dur: "=Math.max(0.5, Math.min(6, 1500 / (Number.parseFloat(props.itemLoadPower ? items[props.itemLoadPower].state : 1) || 1))) + 's'"
                      - component: f7-row
                        config:
                          tag: path
                          d: M380 100 L385 105 L390 100
                          fill: none
                          stroke: "=props.dc2actohouseFlowColor || 'var(--icon-color-default)'"
                          stroke-width: 3
                          stroke-linecap: round
                          stroke-linejoin: round

                # solar to ac2dc flow
                - component: f7-row
                  config:
                    tag: g
                    class: smooth-fade
                    opacity: "=props.itemPVPower && Number.parseFloat(items[props.itemPVPower].state) > 5 ? '1' : '0'"
                  slots:
                    default:
                      - component: f7-row
                        config:
                          tag: path
                          d: M0 160 L75 160 L75 90
                          fill: none
                          stroke: "=props.solartoac2dcFlowColor || 'var(--icon-color-default)'"
                          stroke-width: 3
                          stroke-linecap: round
                          stroke-linejoin: round
                          stroke-dasharray: 10 6
                        slots:
                          default:
                            - component: f7-row
                              config:
                                tag: animate
                                attributeName: stroke-dashoffset
                                values: 16;0
                                repeatCount: indefinite
                                dur: "=Math.max(0.5, Math.min(6, 1500 / (Number.parseFloat(props.itemPVPower ? items[props.itemPVPower].state : 1) || 1))) + 's'"
                      - component: f7-row
                        config:
                          tag: path
                          d: M70 95 L75 90 L80 95
                          fill: none
                          stroke: "=props.solartoac2dcFlowColor || 'var(--icon-color-default)'"
                          stroke-width: 3
                          stroke-linecap: round
                          stroke-linejoin: round

          # clickable zones
          # grid voltage chart
          - component: oh-link
            config:
              class: chart-zone
              action: analyzer
              actionAnalyzerItems: =[props.itemGridVoltage]
              tooltip: View Grid History
              style:
                position: absolute
                left: 10px
                top: 80px
                width: 90px
                height: 160px
                z-index: 999
                cursor: pointer

          # pv power chart
          - component: oh-link
            config:
              class: chart-zone
              action: analyzer
              actionAnalyzerItems: =[props.itemPVPower]
              tooltip: View Solar History
              visible: "=props.itemPVPower ? (Number.parseFloat(items[props.itemPVPower].state) > 5) : true"
              style:
                position: absolute
                left: 10px
                top: 240px
