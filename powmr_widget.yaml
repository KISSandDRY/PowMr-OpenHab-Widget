component: f7-card
config:
  title: 'PowMr Inverter Status'
  stylesheet: |
    .smooth-fade {
      transition: opacity 0.4s ease-in-out !important;
    }
    .chart-zone {
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }
    .chart-zone:hover {
      background-color: rgba(128, 128, 128, 0.1) !important;
    }
  style:
    position: relative
    width: 100%
    max-width: 580px
    aspect-ratio: 550 / 400
    overflow: hidden
    container-type: inline-size
    --icon-color-default: '=(themeOptions.dark === "dark") ? "white" : "black"'
    --bg-color-default: '=(themeOptions.dark === "dark") ? "#262626" : "#ffffff"'
    --text-color-default: '=(themeOptions.dark === "dark") ? "#ffffff" : "#333333"'
    background-color: '=props.bgColor || "var(--bg-color-default)"'
    color: '=props.textColor || "var(--text-color-default)"'

slots:
  default:

    # online status text
    - component: Label
      config:
        text: '=(props.inverterOnline && items[props.inverterOnline].state === "online") ? "ONLINE" : "OFFLINE"'
        style:
          position: absolute
          top: 8px
          right: 12px
          width: 75px
          height: 25px
          box-sizing: border-box
          display: flex
          align-items: center
          justify-content: center
          padding: 0
          background-color: '=(props.inverterOnline && items[props.inverterOnline].state === "online") ? "#4caf50" : "#f44336"'
          color: "#ffffff"
          border-radius: 15px
          font-size: 11px
          font-weight: bold
          font-family: ui-monospace, SFMono-Regular, Consolas, monospace
          text-align: center
          box-shadow: 0px 2px 4px rgba(0,0,0,0.2)
          z-index: 100

    # main wrapper
    - component: f7-block
      config:
        style:
          position: absolute
          top: 0
          left: 0
          width: 550px
          height: 400px
          transform: scale(calc(100cqi / 550px))
          transform-origin: top left
          margin: 0
          padding: 0
          # dim the whole dashboard if offline
          transition: filter 0.5s, opacity 0.5s
          opacity: '=(props.inverterOnline && items[props.inverterOnline].state === "online") ? "1" : "0.4"'
          filter: '=(props.inverterOnline && items[props.inverterOnline].state === "online") ? "none" : "grayscale(100%)"'

      slots:
        default:
          # grid tower icon
          - component: f7-block
            config:
              class: smooth-fade
              style:
                position: absolute
                left: 5px
                top: 13px
                width: 100px
                height: 300px
